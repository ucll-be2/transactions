info:
  name: Deposit €100 to account 1
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/accounts/:accountId/deposits"
  params:
    - name: accountId
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "amount": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
