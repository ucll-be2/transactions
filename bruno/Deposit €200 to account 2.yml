info:
  name: Deposit €200 to account 2
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/accounts/:accountId/deposits"
  params:
    - name: accountId
      value: "2"
      type: path
  body:
    type: json
    data: |-
      {
        "amount": 200
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
