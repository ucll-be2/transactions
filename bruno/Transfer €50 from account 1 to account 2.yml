info:
  name: Transfer €50 from account 1 to account 2
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v1/transfers"
  body:
    type: json
    data: |-
      {
        "fromAccountId": 1,
        "toAccountId": 2,
        "amount": 50
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
